[project]
name = "minimai"
version = "0.1.0"
description = "Minimai Sonolus Engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "sonolus-py>=0.18.1",
]

[project.optional-dependencies]
# The pack tools (images and audio), and audio conversion for the chart folders in resources/levels.
tools = [
    "imageio-ffmpeg>=0.7.0",
    "pillow>=10.0.0",
]
