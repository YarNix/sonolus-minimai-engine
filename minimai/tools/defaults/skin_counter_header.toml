"Mai Counter Header Combo AP" = { skip = false }
"Mai Counter Header Combo FC Plus" = { skip = false }
"Mai Counter Header Combo FC" = { skip = false }
"Mai Counter Header Combo Miss" = { skip = false }
"Mai Counter Header Achievement Triple S" = { skip = false }
"Mai Counter Header Achievement Pass S" = { skip = false }
"Mai Counter Header Achievement Pass" = { skip = false }
"Mai Counter Header Achievement Fail" = { skip = false }
