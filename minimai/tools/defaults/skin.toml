# The skin pack's defaults: every sprite's recipe and the params they use. A source's pack.toml is
# merged over this file. The format is in docs/packs.md.

[texture]
max_size = 8192
padding = 1
interpolation = true

[params]
# The hold images' caps: head and tail, in source px.
hold_border = 58
# Break notes pulse between a dark and a light copy.
break_light = { multiply = 1.634, add = 1.43 }
break_dark = { multiply = 0.9, add = 0 }
# A held hold shines between these copies of its "on" image.
hold_on_light = { multiply = 1.45, add = 0 }
hold_on_dark = { multiply = 0.95, add = 0 }
# EX outlines: one white image tinted per kind.
ex_tint_normal = [255, 173, 226]
ex_tint_star = [0, 250, 255]
ex_tint_each = [255, 254, 119]
ex_tint_break = [255, 254, 119]
# Note guide lines are big and thin: half resolution is enough.
line_scale = 0.5
# The touch hold border bars, cut across the middle of each side: the band's middle from the
# border's center ("auto" finds it from the alpha), and the strip's size.
border_bar_radius = 66.5
border_bar_width = 8
border_bar_length = 52
# Layout sizes in skin px (lib/layout.py): the canvases sources are fitted to. A 0 keeps the source's size.
note_cell = [180, 180]
ring_cell = [987, 987]
line_cell = [1080, 1080]
each_ring_line_cell = [980, 980]
touch_point_cell = [32, 32]
touch_fan_cell = [112, 82]
touch_overlap_border_cell = [228, 228]
touch_just_border_cell = [128, 128]
slide_path_cell = [70, 94]
wifi_slide_path_1_cell = [111, 68]
wifi_slide_path_2_cell = [160, 90]
wifi_slide_path_3_cell = [204, 110]
wifi_slide_path_4_cell = [253, 136]
wifi_slide_path_5_cell = [298, 154]
wifi_slide_path_6_cell = [353, 179]
wifi_slide_path_7_cell = [410, 205]
wifi_slide_path_8_cell = [464, 226]
wifi_slide_path_9_cell = [519, 251]
wifi_slide_path_10_cell = [571, 271]
wifi_slide_path_11_cell = [653, 313]
hold_cell = [122, 0]
hold_end_point_cell = [64, 64]
touch_hold_border_cell = [211, 210]
judge_text_cell = [223, 82]
fast_late_cell = [217, 76]
slide_ok_curve_cell = [410, 180]
slide_ok_straight_cell = [428, 140]
slide_ok_wifi_cell = [668, 188]

# The border bars' sprite transform: the quad's corners taken past its ends, mirrored across the bar.
[params.bar_transform]
x1 = { x3 = 1.5, x4 = -0.5 }
x2 = { x3 = -0.5, x4 = 1.5 }
x3 = { x1 = 1.5, x2 = -0.5 }
x4 = { x1 = -0.5, x2 = 1.5 }
y1 = { y3 = 1.5, y4 = -0.5 }
y2 = { y3 = -0.5, y4 = 1.5 }
y3 = { y1 = 1.5, y2 = -0.5 }
y4 = { y1 = -0.5, y2 = 1.5 }

[files]

[sprites]

# Debug
"White Square" = { canvas = { size = [8, 8], paint = [{ shape = "rect", fill = true, color = "#ffffff" }] } }
