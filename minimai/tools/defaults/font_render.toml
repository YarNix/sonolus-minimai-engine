# The header words, one for each display, in its group's colour: Mai Counter Header Combo (the plain
# combo), Mai Counter Header Combo <grade> and Mai Counter Header Achievement <achievement>.
[[sprite_groups]]
name = "Mai Counter Header {sprite}"
look = "Pink"
sprites = "$counter_combo_header"

[[sprite_groups]]
name = "Mai Counter Header {sprite} AP Plus"
