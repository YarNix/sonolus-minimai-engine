# The preview: the sensor group marks under each column (the printed lane numbers' grey), and the slide
# shape labels (lighter, left-aligned on a baseline with room for p and q's descenders).
[[sprite_groups]]
name = "Mai Preview Label {sprite}"
look = "PreviewLabel"
sprites = "$preview_group_labels"
cell = "$preview_label_cell"
size = { ink_height = 51.2, reference = "H" }
align_x = "ink"
align_y = "ink"
fill = [128, 128, 128]
overflow = "shrink_group"

[[sprite_groups]]
name = "Mai Preview Shape {sprite}"
look = "PreviewLabel"
sprites = "$preview_shape_labels"
cell = "$preview_shape_cell"
size = { ink_height = 32, reference = "H" }
align_x = "left"
margin = 5.12
align_y = "baseline"
baseline = 43.52
fill = [215, 215, 215]
overflow = "shrink_group"
